<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Olimpiadas escolares: clasificación por curso, disciplinas y agenda de encuentros. Versión de demostración." />
    <meta name="theme-color" content="#f4f1e8" />
    <link rel="icon" type="image/jpeg" href="/ueea-logo.jpg" />
    <title>Olimpiadas escolares — Campeón de campeones</title>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('olimpiadas-theme'); } catch {}
        const theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#202d28' : '#f4f1e8';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
